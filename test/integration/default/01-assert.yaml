---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
status:
  scale:
    replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
status:
  readyReplicas: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: java-app
spec:
  initContainers:
    - name: opentelemetry-auto-instrumentation-java
---
# The `edit` role manages the resources, and the `view` role reads them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: test "$(kubectl auth can-i create instrumentations.opentelemetry.io -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i delete instrumentations.opentelemetry.io -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i list instrumentations.opentelemetry.io -n $NAMESPACE --as=viewer)" = yes
  - script: test "$(kubectl auth can-i create instrumentations.opentelemetry.io -n $NAMESPACE --as=viewer)" = no
