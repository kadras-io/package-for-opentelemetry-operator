---
# The operator is deployed in a custom namespace, with a standby replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-operator-controller-manager
  namespace: observability
status:
  readyReplicas: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opentelemetry-operator-controller-manager
  namespace: observability
---
# cert-manager issued the webhook certificate for the custom namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opentelemetry-operator-serving-cert
  namespace: observability
status:
  conditions:
    - type: Ready
      status: "True"
