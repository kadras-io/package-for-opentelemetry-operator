---
args:
  watch-namespace: observability,apps
  --zap-level-key: severity
  # A computed flag can be overridden.
  zap-log-level: debug
  # An upstream flag can be removed.
  zap-time-encoding: null
config:
  collector-image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
  feature-gates: operator.networkpolicy
  # A computed option can be overridden, or removed.
  metrics-secure: false
  metrics-addr: ":8080"
  enable-multi-instrumentation: null
